<!DOCTYPE html>
<html>
<head>
  <!-- 加入這行就能正常顯示中文 -->
  <meta charset="UTF-8">
  <style>
    body { 
      margin: 0; 
      padding: 10px; 
      display: flex; 
      flex-direction: column; 
      height: 100vh; /* 全高 */
      box-sizing: border-box;
    }
    textarea { 
      flex-grow: 1; /* 讓輸入框自動填滿剩餘空間 */
      width: 100%; 
      resize: none; 
    }
  </style>
</head>
<body>
  <textarea id="userInput" placeholder="隨手記點什麼..."></textarea>
  <div class="status">內容將自動同步儲存</div>
  <script src="popup.js"></script>
</body>
</html>
